services:
  - type: web
    name: drink-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drink-tracker-db
          property: connectionString

databases:
  - name: drink-tracker-db
    plan: free
