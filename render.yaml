services:
  - type: web
    name: drink-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drink-tracker-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/New_York
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: onboarding@resend.dev

databases:
  - name: drink-tracker-db
    plan: free
