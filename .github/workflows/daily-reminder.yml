name: Daily Drink Reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/tasks/send-reminders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
